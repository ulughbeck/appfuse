name: appfuse
description: Orchestrates Flutter app startup with init steps, environment configs, saved locale and theme, permissions, and debug tools in one scope.

homepage: https://github.com/ulughbeck/appfuse
repository: https://github.com/ulughbeck/appfuse
issue_tracker: https://github.com/ulughbeck/appfuse/issues

topics:
  - scope
  - settings
  - state-management
  - dependency-injection
  - appfuse

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

version: 0.0.3

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

workspace:
  - example

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_info_plus_platform_interface: ^4.1.0
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
